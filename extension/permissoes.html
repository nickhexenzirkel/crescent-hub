<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Uniko Call — Autorizar microfone</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 20px; color: #222; text-align: center; }
  h1 { font-size: 18px; }
  p { font-size: 14px; color: #555; line-height: 1.5; }
  button { padding: 12px 22px; border-radius: 10px; border: none; background: #d4a017; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin-top: 18px; font-size: 13.5px; font-weight: 600; }
  #status.ok { color: #2a8f4f; }
  #status.erro { color: #c0392b; }
</style>
</head>
<body>
  <h1>Uniko Call — Autorizar microfone</h1>
  <p>Essa autorização só precisa ser feita <strong>uma vez</strong>. Depois disso, pode fechar esta aba — a gravação de chamada volta a funcionar normalmente pelo popup da extensão.</p>
  <button id="btn">Autorizar microfone</button>
  <div id="status"></div>
  <script src="permissoes.js"></script>
</body>
</html>
